<!DOCTYPE html><html><head><title>AI Reel Generator</title></head><body><h1>🎬 AI Reel Generator</h1><input type="text" id="topic" placeholder="Enter topic"><button onclick="generate()">Generate Reel</button><p id="output"></p>
<script>async function generate(){let topic=document.getElementById("topic").value;document.getElementById("output").innerText="Loading...";let res=await fetch("/.netlify/functions/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({topic})});let data=await res.json();document.getElementById("output").innerText=data.output;}</script></body></html>
